<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Carta</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo1.css') }}">
</head>
<body>
{% extends 'base.html' %}
{% block titulo %}{% if carta %}Editar carta{% else %}Nueva carta{% endif %}{% endblock %}

{% block contenido %}
    <h1 class="titulo-animado">{% if carta %}Editar carta{% else %}Nueva carta{% endif %}</h1>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <p><input type="text" name="titulo" placeholder="Título" maxlength="120" required
                  value="{{ carta.titulo if carta else '' }}"
                  style="padding:10px;width:90%;border-radius:10px;border:1px solid #ccc;"></p>
        <p><textarea name="contenido" placeholder="Escribe la carta..." rows="10" required
                  style="padding:10px;width:90%;border-radius:10px;border:1px solid #ccc;font-family:inherit;">{{ carta.contenido if carta else '' }}</textarea></p>
        <p>
            <label for="fecha_desbloqueo">Se abre el (opcional):</label><br>
            <input type="datetime-local" id="fecha_desbloqueo" name="fecha_desbloqueo"
                   value="{{ carta.fecha_desbloqueo.strftime('%Y-%m-%dT%H:%M') if carta and carta.fecha_desbloqueo else '' }}"
                   style="padding:10px;border-radius:10px;border:1px solid #ccc;">
        </p>
        <button type="submit" class="boton-regalo" style="border:none;cursor:pointer;">
            {% if carta %}Guardar cambios{% else %}Crear carta{% endif %}
        </button>
    </form>
{% endblock %}
</body>
</html>
